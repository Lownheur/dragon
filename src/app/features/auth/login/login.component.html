<div class="auth-form">
  <h2 class="auth-form__title">{{ t('auth.login') }}</h2>
  <p class="auth-form__sub">{{ t('auth.welcomeBack') || 'Content de vous revoir.' }}</p>

  @if (errorMessage()) {
    <div class="auth-form__error">{{ errorMessage() }}</div>
  }

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="auth-form__fields">
    <label class="field">
      <span class="field__label">{{ t('auth.email') }}</span>
      <input
        id="login-email"
        class="field__input"
        type="email"
        placeholder="votre@email.com"
        formControlName="email"
      />
      @if (getError('email')) {
        <span class="field__error">{{ getError('email') }}</span>
      }
    </label>

    <label class="field">
      <span class="field__label">{{ t('auth.password') }}</span>
      <input
        id="login-password"
        class="field__input"
        type="password"
        placeholder="••••••"
        formControlName="password"
      />
      @if (getError('password')) {
        <span class="field__error">{{ getError('password') }}</span>
      }
    </label>

    <button type="submit" class="auth-form__submit" [disabled]="isSubmitting()">
      {{ isSubmitting() ? t('auth.loggingIn') || 'Connexion...' : t('auth.submit') }}
    </button>
  </form>

  <p class="auth-form__footer">
    {{ t('auth.noAccount') }} <a routerLink="/auth/register" class="auth-form__link">{{ t('auth.createAccount') }}</a>
  </p>
</div>
