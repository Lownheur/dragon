<div class="auth-form">
  <h2 class="auth-form__title">{{ t('auth.register') }}</h2>
  <p class="auth-form__sub">{{ t('auth.registerSub') || "C'est gratuit et prend 30 secondes." }}</p>

  @if (errorMessage()) {
    <div class="auth-form__error">{{ errorMessage() }}</div>
  }

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="auth-form__fields">
    <label class="field">
      <span class="field__label">{{ t('auth.email') }}</span>
      <input
        id="register-email"
        class="field__input"
        type="email"
        placeholder="votre@email.com"
        formControlName="email"
      />
      @if (getError('email')) {
        <span class="field__error">{{ getError('email') }}</span>
      }
    </label>

    <label class="field">
      <span class="field__label">{{ t('auth.password') }}</span>
      <input
        id="register-password"
        class="field__input"
        type="password"
        placeholder="••••••"
        formControlName="password"
      />
      @if (getError('password')) {
        <span class="field__error">{{ getError('password') }}</span>
      }
    </label>

    <label class="field">
      <span class="field__label">{{ t('auth.confirmPassword') || 'Confirmer le mot de passe' }}</span>
      <input
        id="register-confirm"
        class="field__input"
        type="password"
        placeholder="••••••"
        formControlName="confirmPassword"
      />
      @if (getError('confirmPassword')) {
        <span class="field__error">{{ getError('confirmPassword') }}</span>
      }
    </label>

    <button type="submit" class="auth-form__submit" [disabled]="isSubmitting()">
      {{ isSubmitting() ? (t('auth.creating') || 'Création...') : (t('auth.createCta') || 'Créer mon compte') }}
    </button>
  </form>

  <p class="auth-form__footer">
    {{ t('auth.hasAccount') }} <a routerLink="/auth/login" class="auth-form__link">{{ t('auth.loginLink') }}</a>
  </p>
</div>
