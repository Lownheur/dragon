<div class="auth-form">
  <h2 class="auth-form__title">Créer un compte</h2>
  <p class="auth-form__sub">C'est gratuit et prend 30 secondes.</p>

  @if (errorMessage()) {
    <div class="auth-form__error">{{ errorMessage() }}</div>
  }

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="auth-form__fields">
    <label class="field">
      <span class="field__label">Email</span>
      <input
        id="register-email"
        class="field__input"
        type="email"
        placeholder="votre@email.com"
        formControlName="email"
      />
      @if (getError('email')) {
        <span class="field__error">{{ getError('email') }}</span>
      }
    </label>

    <label class="field">
      <span class="field__label">Mot de passe</span>
      <input
        id="register-password"
        class="field__input"
        type="password"
        placeholder="••••••"
        formControlName="password"
      />
      @if (getError('password')) {
        <span class="field__error">{{ getError('password') }}</span>
      }
    </label>

    <label class="field">
      <span class="field__label">Confirmer le mot de passe</span>
      <input
        id="register-confirm"
        class="field__input"
        type="password"
        placeholder="••••••"
        formControlName="confirmPassword"
      />
      @if (getError('confirmPassword')) {
        <span class="field__error">{{ getError('confirmPassword') }}</span>
      }
    </label>

    <button type="submit" class="auth-form__submit" [disabled]="isSubmitting()">
      {{ isSubmitting() ? 'Création...' : 'Créer mon compte' }}
    </button>
  </form>

  <p class="auth-form__footer">
    Déjà un compte ? <a routerLink="/login" class="auth-form__link">Se connecter</a>
  </p>
</div>
