<div class="chat">
  <div class="chat__header">
    <span class="chat__title">{{ t('chat.title') }}</span>
    <button class="chat__clear" (click)="clearChat()" [title]="t('chat.clear')">🗑️</button>
  </div>

  <div class="chat__messages">
    @if (messages().length === 0) {
      <div class="chat__empty">
        <p>{{ t('chat.empty') }}</p>
      </div>
    }
    @for (msg of messages(); track $index) {
      <div
        class="chat__message"
        [class.chat__message--user]="msg.role === 'user'"
        [class.chat__message--assistant]="msg.role === 'assistant'"
      >
        <span class="chat__bubble">{{ msg.content }}</span>
      </div>
    }
    @if (isLoading()) {
      <div class="chat__message chat__message--assistant">
        <span class="chat__bubble chat__typing">...</span>
      </div>
    }
  </div>

  <div class="chat__input-area">
    <textarea
      class="chat__input"
      [placeholder]="t('chat.placeholder')"
      [value]="userInput()"
      (input)="userInput.set($any($event.target).value)"
      (keydown)="onKeydown($event)"
      rows="1"
    ></textarea>
    <button class="chat__send" (click)="send()" [disabled]="!canSend()">→</button>
  </div>
</div>
