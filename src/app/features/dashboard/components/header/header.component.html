<header class="header">
  <button class="header__hamburger" (click)="onToggleSidebar()" aria-label="Menu">
    <span class="header__hamburger-line"></span>
    <span class="header__hamburger-line"></span>
    <span class="header__hamburger-line"></span>
  </button>
  <span class="header__logo">{{ t('app.name') }}</span>
  <div class="header__actions">
    <button class="header__lang-btn" (click)="onToggleLocale()" aria-label="Switch language">
      {{ locale().toUpperCase() }}
    </button>
    <button class="header__theme-btn" (click)="onToggleTheme()" aria-label="Switch theme">
      @if (theme() === 'light') {
        <span>🌙</span>
      } @else {
        <span>☀️</span>
      }
    </button>
  </div>
</header>
