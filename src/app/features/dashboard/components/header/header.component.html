<header class="header">
  <button class="header__hamburger" (click)="onToggleSidebar()" [attr.aria-label]="t('header.openMenu')">
    <span class="header__hamburger-line"></span>
    <span class="header__hamburger-line"></span>
    <span class="header__hamburger-line"></span>
  </button>

  <span class="header__logo">{{ t('app.name') }}</span>

  <div class="header__actions">
    <button class="header__lang-btn" (click)="onToggleLocale()" [attr.aria-label]="t('header.switchLang')">
      {{ locale().toUpperCase() }}
    </button>
    <button class="header__theme-btn" (click)="onToggleTheme()" [attr.aria-label]="t('header.switchTheme')">
      @if (theme() === 'light') {
        <span>🌙</span>
      } @else {
        <span>☀️</span>
      }
    </button>
    <button class="header__chat-btn" (click)="onToggleChat()" [attr.aria-label]="t('header.openChat')">
      🤖
    </button>
  </div>
</header>
