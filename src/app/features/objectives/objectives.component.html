<div class="objectives">
  <header class="objectives__header">
    <h1 class="objectives__title">🎯 Objectifs & Roadmaps</h1>
    <p class="objectives__subtitle">Définis tes objectifs et suis ta progression RPG</p>
  </header>

  <div class="objectives__list">
    @for (obj of objectives(); track obj.id) {
      <div class="objective-card" [class]="'objective-card--' + obj.type">
        <div class="objective-card__head">
          <span class="objective-card__label">{{ obj.label }}</span>
          <span class="objective-card__level">Nv.{{ obj.level }}</span>
        </div>

        <div class="objective-card__progress-bar">
          <div class="objective-card__progress-fill" [style.width.%]="obj.progress"></div>
        </div>

        <div class="objective-card__stats">
          <span class="objective-card__progress-text">{{ obj.progress }}%</span>
          <span class="objective-card__xp">{{ obj.xp }} XP</span>
          <span class="objective-card__xp-needed">→ {{ xpForLevel(obj.level) }} XP</span>
        </div>
      </div>
    }
  </div>

  <div class="objectives__add">
    <input
      class="objectives__input"
      type="text"
      placeholder="Nouvel objectif... (ex: Lire 30min/jour)"
      [value]="newObjectiveLabel()"
      (input)="newObjectiveLabel.set($any($event.target).value)"
      (keydown)="onKeydown($event)"
    />
    <button class="objectives__add-btn" (click)="addObjective()">+ Ajouter</button>
  </div>
</div>
