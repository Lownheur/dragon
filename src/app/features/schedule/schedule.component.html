<div class="schedule">
  <header class="schedule__header">
    <div class="schedule__nav">
      <button class="schedule__nav-btn" (click)="previousWeek()">←</button>
      <h1 class="schedule__title">{{ formattedDate() }}</h1>
      <button class="schedule__nav-btn" (click)="nextWeek()">→</button>
    </div>
    <p class="schedule__subtitle">EDT adaptatif — Objectifs du jour</p>
  </header>

  <div class="schedule__blocks">
    @for (block of scheduleBlocks(); track $index) {
      <div class="schedule__block" [class]="'schedule__block--' + block.type" [class.schedule__block--done]="block.done">
        <div class="schedule__time">{{ block.time }}</div>
        <div class="schedule__label">{{ block.label }}</div>
        <button class="schedule__check" (click)="toggleBlock($index)" [class.schedule__check--done]="block.done">
          @if (block.done) { ✓ } @else { · }
        </button>
      </div>
    }
  </div>
</div>
